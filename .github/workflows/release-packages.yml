name: Release packages

# Builds ready-to-run archives per platform and attaches them to a GitHub Release.
# macOS jobs also produce a Developer ID–signed (and optionally notarized) .pkg.
# Manual only — Actions → Release packages → Run workflow; tick the platforms to build.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      skip_notary:
        description: 'Skip macOS notarization (still Developer ID–sign the .pkg)'
        required: false
        type: boolean
        default: false
      macos_arm64:
        description: 'macOS Apple Silicon (.pkg + .tar.gz)'
        type: boolean
        default: true
      macos_x64:
        description: 'macOS Intel (.pkg + .tar.gz)'
        type: boolean
        default: true
      linux_arm64:
        description: 'Linux arm64 / Raspberry Pi (.deb + .tar.gz)'
        type: boolean
        default: true
      linux_x64:
        description: 'Linux x86_64 (.deb + .tar.gz)'
        type: boolean
        default: true
      windows_x64:
        description: 'Windows x64 (.zip + .tar.gz) — experimental'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  # The platforms ticked in the run dialog → the matrices of `build` (macOS, Windows) and `linux`.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      linux: ${{ steps.plan.outputs.linux }}
    steps:
      - id: plan
        env:
          MACOS_ARM64: ${{ inputs.macos_arm64 }}
          MACOS_X64: ${{ inputs.macos_x64 }}
          LINUX_ARM64: ${{ inputs.linux_arm64 }}
          LINUX_X64: ${{ inputs.linux_x64 }}
          WINDOWS_X64: ${{ inputs.windows_x64 }}
        run: |
          build='[]'
          linux='[]'
          add() { jq -c --argjson e "$2" '. + [$e]' <<<"$1"; }
          [[ "$MACOS_ARM64" == true ]] && build=$(add "$build" '{"platform":"darwin-arm64","runner":"macos-14","macos":true}')
          # macos-15-intel is the current x86_64 macOS runner (macos-13 retired Dec 2025)
          [[ "$MACOS_X64" == true ]] && build=$(add "$build" '{"platform":"darwin-x64","runner":"macos-15-intel","macos":true}')
          # Experimental — rsync/packaging issues on windows-2022 kept it disabled so far.
          [[ "$WINDOWS_X64" == true ]] && build=$(add "$build" '{"platform":"win32-x64","runner":"windows-2022","macos":false}')
          [[ "$LINUX_X64" == true ]] && linux=$(add "$linux" '{"platform":"linux-x64","runner":"ubuntu-24.04"}')
          [[ "$LINUX_ARM64" == true ]] && linux=$(add "$linux" '{"platform":"linux-arm64","runner":"ubuntu-24.04-arm"}')
          if [[ "$build" == '[]' && "$linux" == '[]' ]]; then
            echo "Tick at least one platform." >&2
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "macOS / Windows: $build"
          echo "Linux: $linux"

  build:
    name: ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.build != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        shell: bash
        run: npm run build

      - name: Production prune
        shell: bash
        run: npm prune --omit=dev

      - name: Package prebuilt
        shell: bash
        env:
          HARBOR_PLATFORM: ${{ matrix.platform }}
        run: |
          chmod +x create-package.sh start.sh install.sh create-macos-pkg.sh
          chmod +x packaging/macos/ci-import-signing.sh packaging/macos/ci-cleanup-signing.sh
          ./create-package.sh --prebuilt
          # Always offer a zip for Windows downloads
          if [[ "${{ matrix.platform }}" == win32-* ]]; then
            NAME=$(basename dist/packages/*.tar.gz .tar.gz)
            (cd dist/packages && mkdir -p _z && tar -xzf "${NAME}.tar.gz" -C _z)
            if command -v zip >/dev/null 2>&1; then
              (cd dist/packages/_z && zip -qr "../${NAME}.zip" "$NAME")
            else
              powershell.exe -NoProfile -Command \
                "Compress-Archive -Path 'dist/packages/_z/${NAME}' -DestinationPath 'dist/packages/${NAME}.zip' -Force"
            fi
            rm -rf dist/packages/_z
          fi

      - name: Import macOS signing certificate
        if: matrix.macos
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: ./packaging/macos/ci-import-signing.sh

      - name: Sign macOS package (.pkg)
        if: matrix.macos
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "${{ inputs.skip_notary }}" == "true" ]]; then
            ./create-macos-pkg.sh --skip-notary
          elif [[ -n "${APPLE_API_KEY_BASE64:-}" || -n "${APPLE_ID:-}" ]]; then
            ./create-macos-pkg.sh --require-notary
          else
            ./create-macos-pkg.sh
          fi

      - name: Cleanup macOS signing keychain
        if: matrix.macos && always()
        run: ./packaging/macos/ci-cleanup-signing.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/packages/*.tar.gz
            dist/packages/*.tar.gz.sha256
            dist/packages/*.pkg
            dist/packages/*.pkg.sha256
            dist/packages/*.zip
          if-no-files-found: error
          retention-days: 14

  # Built in Debian 12 (bookworm, glibc 2.36) so the binaries also run on
  # Raspberry Pi OS Bookworm — Ubuntu 24.04 runners would need glibc 2.39.
  linux:
    name: ${{ matrix.platform }}
    needs: plan
    if: needs.plan.outputs.linux != '[]'
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}

    steps:
      - name: Install build deps (ALSA)
        run: |
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake ninja-build pkg-config python3 \
            libasound2-dev liblilv-dev lv2-dev curl ca-certificates git rsync

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Production prune
        run: npm prune --omit=dev

      - name: Package prebuilt (.tar.gz)
        env:
          HARBOR_PLATFORM: ${{ matrix.platform }}
        run: |
          chmod +x create-package.sh create-deb.sh start.sh install.sh
          ./create-package.sh --prebuilt

      - name: Package Debian (.deb)
        run: ./create-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/packages/*.tar.gz
            dist/packages/*.tar.gz.sha256
            dist/packages/*.deb
            dist/packages/*.deb.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: [plan, build, linux]
    # A platform group that was not ticked is skipped — release unless something failed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Validate tag
        run: |
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Tag must look like v1.0.0 (got: $TAG)" >&2
            exit 1
          fi
          echo "Publishing release $TAG"

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: package-*
          merge-multiple: true

      # The one-line installer goes with any Linux package.
      # In its own folder: checkout empties the folder it checks out into.
      - uses: actions/checkout@v4
        if: needs.plan.outputs.linux != '[]'
        with:
          path: src
          sparse-checkout: packaging/linux

      - name: Add Linux installer script
        if: needs.plan.outputs.linux != '[]'
        run: cp src/packaging/linux/install-linux.sh release-assets/

      - name: List assets
        run: find release-assets -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          body: |
            Prebuilt **ready-to-start** packages (Node ${{ env.NODE_VERSION }}).

            | Asset | Platform |
            |---|---|
            | `*-darwin-arm64.pkg` | Apple Silicon Mac — signed installer |
            | `*-darwin-x64.pkg` | Intel Mac — signed installer |
            | `*-darwin-arm64.tar.gz` | Apple Silicon Mac (portable) |
            | `*-darwin-x64.tar.gz` | Intel Mac (portable) |
            | `*_arm64.deb` | Raspberry Pi 64-bit / ARM64 — Debian package with systemd service |
            | `*_amd64.deb` | Linux x86_64 — Debian package with systemd service |
            | `install-linux.sh` | one-line installer for the `.deb` |
            | `*-linux-x64.tar.gz` | Linux x86_64 (portable) |
            | `*-linux-arm64.tar.gz` | Raspberry Pi 64-bit / ARM64 Linux (portable) |

            **macOS:** prefer the `.pkg` (Developer ID signed; notarized when credentials are configured). Installs to `/usr/local/audio-harbor-headless` and adds `audioharbor` on `PATH`.
            **Portable:** unpack a `.tar.gz` → `./start.sh`. **Node.js is bundled** under `runtime/`.
            macOS: typically **macOS 11+**.
            **Raspberry Pi OS / Debian / Ubuntu:** `curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-linux.sh | sudo bash` — installs the `.deb` to `/opt/audio-harbor-headless` and starts service `audioharbor@<user>`. Built on Debian 12 (glibc 2.32+): Raspberry Pi OS Bookworm or newer, Debian 12+, Ubuntu 22.04+.
            Portable Linux: `sudo apt install libasound2` if ALSA is missing.
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/*.pkg
            release-assets/*.deb
            release-assets/install-linux.sh
            release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
