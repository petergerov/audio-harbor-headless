name: Release packages

# Builds ready-to-run archives per platform and attaches them to a GitHub Release.
# Manual only — Actions → Release packages → Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            apt: false
          # macos-15-intel is the current x86_64 macOS runner (macos-13 retired Dec 2025)
          - platform: darwin-x64
            runner: macos-15-intel
            apt: false
          - platform: linux-x64
            runner: ubuntu-24.04
            apt: true
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            apt: true
          # Temporarily disabled — rsync/packaging issues on windows-2022
          # - platform: win32-x64
          #   runner: windows-2022
          #   apt: false

    steps:
      - uses: actions/checkout@v4

      # juceaide (built during JUCE FetchContent) needs X11/freetype even for
      # headless audio-only targets — see JUCE docs/Linux Dependencies.md
      - name: Install Linux build deps (ALSA + JUCE)
        if: matrix.apt
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        shell: bash
        env:
          # Same JUCE stack on every platform (fetched + linked into harbor_engine.node)
          HARBOR_WITH_JUCE: '1'
        run: npm run build

      - name: Production prune
        shell: bash
        run: npm prune --omit=dev

      - name: Package prebuilt
        shell: bash
        env:
          HARBOR_PLATFORM: ${{ matrix.platform }}
        run: |
          chmod +x create-package.sh start.sh install.sh
          ./create-package.sh --prebuilt
          # Always offer a zip for Windows downloads
          if [[ "${{ matrix.platform }}" == win32-* ]]; then
            NAME=$(basename dist/packages/*.tar.gz .tar.gz)
            (cd dist/packages && mkdir -p _z && tar -xzf "${NAME}.tar.gz" -C _z)
            if command -v zip >/dev/null 2>&1; then
              (cd dist/packages/_z && zip -qr "../${NAME}.zip" "$NAME")
            else
              # GitHub windows-latest may lack zip; PowerShell works everywhere
              powershell.exe -NoProfile -Command \
                "Compress-Archive -Path 'dist/packages/_z/${NAME}' -DestinationPath 'dist/packages/${NAME}.zip' -Force"
            fi
            rm -rf dist/packages/_z
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: |
            dist/packages/*.tar.gz
            dist/packages/*.tar.gz.sha256
            dist/packages/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Validate tag
        run: |
          TAG="${{ inputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Tag must look like v1.0.0 (got: $TAG)" >&2
            exit 1
          fi
          echo "Publishing release $TAG"

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: package-*
          merge-multiple: true

      - name: List assets
        run: find release-assets -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          body: |
            Prebuilt **ready-to-start** packages (Node ${{ env.NODE_VERSION }}).

            | Asset | Platform |
            |---|---|
            | `*-darwin-arm64.tar.gz` | Apple Silicon Mac (M1/M2/M3/…) |
            | `*-darwin-x64.tar.gz` | Intel Mac |
            | `*-linux-x64.tar.gz` | Linux x86_64 |
            | `*-linux-arm64.tar.gz` | Raspberry Pi 64-bit / ARM64 Linux |

            Unpack → `./start.sh`. **Node.js is bundled** under `runtime/` (no system Node needed).
            macOS: typically **macOS 11+**.
            Linux: `sudo apt install libasound2` if ALSA is missing.
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
