[server]
host = "0.0.0.0"
port = 8887
name = "Audio Harbor Headless"
# Reachable as http://ahh.local:8887 (mDNS / Bonjour; "ahh-2" when the name is taken).
# Not "audioharbor" — that name belongs to the macOS Audio Harbor app.
# Ports are offset from the Mac app (8787 / 49153 / 8200) so both can run on one machine.
# "" turns names off. Extra names resolve to the same host:
local_hostname = "ahh"
local_hostname_aliases = ["audioharbor-headless"]

[library]
roots = []

[output]
# device_uid = ""        # a DAC, or a network player: "upnp:uuid:…"
mode = "shared"          # shared | exclusive | dop
dsd_pcm_level = 3        # 0 | 3 | 6
# Audio stack: auto | native
#   auto / native → Mac Core Audio | Linux ALSA hw: | Windows WASAPI Exclusive/DoP
backend = "auto"
# Network players (UPnP / DLNA): full | wifi
#   full → the file untouched when the player takes it; DSD by [network.dsd_modes]
#   wifi → DSD / SACD as 44.1 kHz / 16-bit PCM (~1.4 Mbit/s); other files untouched
network_stream = "full"

[network]
# Network players pull audio from this HTTP port (any free port when taken).
# 49253 avoids the Mac app's preferred 49153.
media_port = 49253

# How each network player gets DSF / DFF / SACD with network_stream = "full":
#   auto → the DSD file untouched when the player lists DSD, else PCM 88.2 kHz / 24-bit
#   pcm  → PCM 88.2 kHz / 24-bit
#   dop  → DoP in a 24-bit WAV (DSD64 → 176.4 kHz) for a DoP DAC behind the player. The player
#          must not change the samples (volume 100 % or fixed, no resampling, no EQ), or it
#          plays loud noise. The host leaves its volume alone.
[network.dsd_modes]
# "upnp:uuid:…" = "dop"

[sharing]
enabled = false
port = 8300
friendly_name = "Audio Harbor Headless"

[remote]
bonjour_enabled = true
bonjour_port = 8888
# false: remotes on the local network connect without a code. true: they pair with the PIN
# first (Settings → About → Require Pairing Code).
require_pairing = false

# Recording from a digital input (S/PDIF), bit-perfect — Linux, e.g. a Raspberry Pi with the
# HiFiBerry Digi+ I/O (dtoverlay=hifiberry-digi). Settings → Record in the remote. See pi-recording.md.
[recording]
enabled = false
# ALSA capture device; "" = the first one found
device = ""
# The rate the source sends: the input cannot tell it, and nothing resamples
rate = 44100
# "" = "Recordings" in the first library folder (else ~/Music/Recordings)
folder = ""
split = "none"           # none | silence
silence_db = -70
silence_seconds = 2
# keep the raw 32-bit WAV of each take in <folder>/.takes
keep_raw = false
